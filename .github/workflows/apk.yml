name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Fix Permissions
        run: |
          cd live_audio_room/android || cd android
          chmod +x gradlew || true
          cd ../..

      - name: Install Dependencies
        run: |
          cd live_audio_room
          flutter pub get

      - name: Build APK
        run: |
          cd live_audio_room
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "live_audio_room/build/app/outputs/flutter-apk/app-release.apk"
          
